name: CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

concurrency:
  group: cicd-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 게이트: 타입 검사 + 코어 테스트 (브라우저 스모크 ui-check 는 로컬에서만)
      - name: Typecheck and test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in Helm values
        run: |
          sed -i 's|^  tag: .*|  tag: "${{ github.sha }}"|' deploy/values.yaml

      - name: Commit and push Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/values.yaml
          git diff --cached --quiet || git commit -m "ci: update image tag to ${{ github.sha }}"
          git push
