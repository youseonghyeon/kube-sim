# kube-sim 정적 서빙. nginx-unprivileged 이미지는 pid/temp 경로가 /tmp 라 루트 파일시스템을 읽기 전용으로 둘 수 있다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # vite 가 해시를 붙인 번들: 영구 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 확인 (새 배포가 바로 보이도록)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
