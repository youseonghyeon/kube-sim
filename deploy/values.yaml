image:
  repository: ghcr.io/youseonghyeon/kube-sim
  # CI가 main push마다 커밋 SHA로 갱신한다. 첫 CI 전에는 latest.
  tag: "f97cfd1bcc452fc4c29ec675987c13f75e007716"
  pullPolicy: IfNotPresent

# ghcr 패키지가 private이면 pull secret 이름을 넣는다. public이면 비워 둔다.
imagePullSecrets: []

# 남겨 둘 옛 ReplicaSet 수. 현재 것 + 옛것 3개까지 유지된다.
revisionHistoryLimit: 3

service:
  port: 8080


resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
