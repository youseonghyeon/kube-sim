image:
  repository: ghcr.io/youseonghyeon/kube-sim
  # CI가 main push마다 커밋 SHA로 갱신한다. 첫 CI 전에는 latest.
  tag: "062026f55d0a29a9634bf3a117f4dd86c66d1b89"
  pullPolicy: IfNotPresent

# ghcr 패키지가 private이면 pull secret 이름을 넣는다. public이면 비워 둔다.
imagePullSecrets: []

# 남겨 둘 옛 ReplicaSet 수. 현재 것 + 옛것 2개까지 유지된다.
revisionHistoryLimit: 2

service:
  port: 8080


resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
